[package]
name = "ringsignature"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ark-bls12-381 = "0.4.0"
ark-ec = "0.4.2"
ark-ff = "0.4.2"
ark-secp256k1 = "0.4.0"
ark-serialize = "0.4.2"
ark-std = "0.4.0"
merlin = "3.0.0"
sha256 = "1.5.0"
rand = "0.8.5"

bulletproofs = {path = "../bulletproofs"}
toolbox = {path = "../toolbox"}

#[features]
#print-trace = [
#    "ark-std/print-trace",
#]

[dev-dependencies]
k256 = { version = "0.13.3", features = ["arithmetic"] }
rand_core = "0.6.4"

